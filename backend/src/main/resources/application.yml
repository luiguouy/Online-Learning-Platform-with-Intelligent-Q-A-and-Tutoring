server:
  port: 8080
  # ==========================================================================
  # 提问长度上限（与 SseChatController.MAX_QUESTION_LENGTH 配套，勿单独改）
  #
  # 背景：SSE 接口 GET /api/qa/chat/stream 把 question 放在 query string（契约冻结为 GET）。
  # Tomcat 在 Http11InputBuffer.fill() / parseHeaders() 处做长度校验（比较 byteBuffer 位置与
  # headerBufferSize；parseRequestLine 自身不含该校验，请求行与请求头共用同一字节预算），
  # 超限抛 IllegalArgumentException: Request header is too large（键 iib.requestheadertoolarge.error），
  # 容器直接返回 HTTP 400，**请求根本进不到 Controller**，前端 EventSource 只看到无信息失败。
  #
  # 【实测数据：原始 socket 二分逼近 + 精确记账；本机 Tomcat 10.1 / Spring Boot 3.3.5】
  #   计数口径 = 「请求行 + 所有请求头 + 各行 CRLF + 结束空行」的总字节数
  #   - 不配本项（Spring Boot 默认 8KB）→ 上限 8192 字节（填充头 8068B 通过 / 8069B 拒绝）
  #   - 配 64KB                        → 上限 65536 字节（填充头 65412 通过 / 65413 拒绝）
  # 结论：
  #   1) 上限**恰好等于配置值（1:1）**。此前注释写的「≈8056 / ≈16370 字节」「约为配置值的
  #      1/4」是测量口径错误（把"请求行"与"请求行+请求头"混为一谈），已由实测推翻；
  #   2) 超限返回 **HTTP 400**，不是 431；
  #   3) 所以本项**不是可选项而是前提**：删掉本行，上限掉回 8192 字节，实测中文提问超过
  #      **888 字**（8189 字节通过 / 889 字 8198 字节被拒）就会被容器以 HTTP 400 直接拒掉，
  #      远低于业务上限 1600 字 —— 即"提问太长应走 event:error 友好提示"这条保障会退化成
  #      "请求进不到 Controller 的无信息失败"。**本项与 MAX_QUESTION_LENGTH 配套，不可单独删改。**
  #
  # 余量：1600 字 × 约 9 字节/字（中文 URL 编码）≈ 14400 字节，仅占 64KB 预算的 22%，
  #       协议层余量充足。故业务上限的定位是**产品级输入约束 + 友好的 event:error 提示**，
  #       而不是"防止被协议层断连"（在 64KB 配置下不会发生）。
  # ==========================================================================
  max-http-request-header-size: 64KB
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: smart-qa-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 必须是 Java 字符集名（UTF-8）；写 utf8mb4 会被 Connector/J 8.x 拒绝并抛
    # UnsupportedEncodingException，导致所有查询失败。Connector/J 8.0.13+ 自动把 UTF-8 映射为 utf8mb4。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smart_qa}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志(log-impl: StdOutImpl)只放在 local profile（见 application-local.yml.example），
    # 生产/测试环境走默认 Slf4j 且不打印 SQL，避免 StdOut 直刷影响日志采集与性能。
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: Authorization       # ★ 关键：Sa-Token 读取的请求头名
  timeout: 604800                 # 7天免登录 (秒)
  active-timeout: 86400
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  token-prefix: Bearer            # ★ 关键：头值须带 "Bearer " 前缀（含一个空格）

# ============================================================================
# RAG 与大模型配置 (路线二：本地零成本 BGE 嵌入 + 独立 OpenAI 兼容对话)
# ============================================================================
rag:
  llm:
    # 聊天大模型端点：可直连 DeepSeek 官方 (https://api.deepseek.com/v1) 或 阿里云百炼 (https://dashscope.aliyuncs.com/compatible-mode/v1)
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:sk-placeholder}
    chat-model: ${AI_CHAT_MODEL:deepseek-chat}    # 支持 deepseek-chat、qwen-plus 等
    temperature: 0.2
    max-tokens: 1500
    timeout-seconds: 60
  # 向量模型说明：已采用内置 BGE-Small-ZH 本地模型 (纯本地CPU计算，零Token费用，无远程接口依赖)
  chroma:
    base-url: http://${CHROMA_HOST:localhost}:8000
    collection-name: smart_qa_course_docs
  chunk:
    size: 400
    overlap: 50
    similarity-threshold: 0.70
    top-k: 4
  # 解析安全上限（M2 加固）：防止解压炸弹/超大文档拖垮切块线程
  ingest:
    max-file-bytes: 20971520        # 单文件解析输入上限 20MB（multipart 50MB 为第一道限制）
    max-text-chars: 500000          # 解析提取文本上限 50 万字符
    parse-timeout-seconds: 120      # 单文件解析超时（秒）

file:
  upload-dir: ${user.home}/smartqa/uploads/

# 应用自定义安全配置
app:
  cors:
    # 允许跨域的前端来源（逗号分隔，Ant 风格、支持端口通配）。
    # 默认仅放行本机 dev；生产须显式改为真实前端域名，例如：
    #   app.cors.allowed-origin-patterns=https://smartqa.example.com
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ============================================================================
# Knife4j 与 OpenAPI3 配置
# ============================================================================
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

knife4j:
  enable: ${SWAGGER_ENABLED:true}
  openapi:
    title: 在线学习智能答疑辅导平台接口文档
    description: "智能答疑平台后端 API 契约与接口调试"
    version: v1.0.0
    group:
      default:
        group-name: 默认核心接口
        api-rule: package
        api-rule-resources:
          - com.smartqa.platform.controller
