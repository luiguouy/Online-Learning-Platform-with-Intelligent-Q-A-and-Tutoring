# =============================================================================
# CI 门禁（Monorepo 根目录自动化流水线）
#
# 设计说明：
#   1. 已配置 paths 过滤器：当 backend/ 下的 Java/pom 或前端 TS/Vue/package.json 变更时自动触发；
#      若仅修改 dev-docs/ 下的文档，则自动跳过流水线。
#   1b. 【多前端包说明】本项目有学生端与教师端两个前端工程（成员 C / D 各一个），
#       采用 frontend-student/ + frontend-teacher/ 双目录布局，分别对应门禁 5 / 门禁 4。
#       下方 frontend/ job 保留为旧单前端布局占位（当前无工程使用）；
#       若两端合并回单一前端工程，则改用 frontend/ 布局即可。
#   2. 三道门禁：密钥扫描（硬门禁）→ 后端编译与全量测试 → 前端类型检查与构建。
#   3. 后端/前端 job 均带 hashFiles 守卫：目录结构不匹配时自动跳过而非报错，
#      原生完美适配 backend/ + frontend/ 单体大仓布局。
#   4. 纪律：CI 红叉不过夜；禁止 skip CI、禁止 --no-verify。
#      详见 dev-docs/COLLABORATION_WORKFLOW.md 第四节。
# =============================================================================

name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.java"
      - "**/pom.xml"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.vue"
      - "**/package.json"
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 门禁 1：密钥扫描（最高优先级，硬失败）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描疑似密钥与私钥
        shell: bash
        run: |
          set -o pipefail
          # 覆盖：OpenAI/通义风格 sk- 密钥、AWS AKIA、PEM 私钥
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=target \
              --exclude-dir=dist . ; then
            echo "::error::发现疑似密钥，请立即从代码中移除并轮换该密钥"
            exit 1
          fi
          echo "✅ 未发现疑似密钥"

  # ---------------------------------------------------------------------------
  # 门禁 2：后端编译与全量测试（Spring Boot + Maven + MySQL 集成）
  #   注意：backend job 跑 `mvn test`（含 @SpringBootTest），依赖 services.mysql + schema/data 导入。
  #   历史盲区：本 job 曾用 `-DskipTests` 只编译，导致「CI 绿 ≠ 后端测试通过」。
  # ---------------------------------------------------------------------------
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    needs: secret-scan
    # 后端 @SpringBootTest 集成用例（SseWiring/SseProtocol）需真实 MySQL + 种子数据；
    # 映射到宿主 13306 避开 ubuntu runner 预装 MySQL 的 3306。纯单测（Rag/Knowledge/Guard）无外部依赖。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: 等待 MySQL 就绪
        if: hashFiles('backend/pom.xml') != ''
        run: |
          for i in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -P 13306 -uroot -p123456 --silent >/dev/null 2>&1; then
              echo "MySQL ready"; break
            fi
            sleep 3
          done

      - name: 导入数据库（schema + 种子数据，供 @SpringBootTest 集成用例）
        if: hashFiles('backend/pom.xml') != ''
        run: |
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 13306 -uroot -p123456 < backend/src/main/resources/db/schema.sql
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 13306 -uroot -p123456 < backend/src/main/resources/db/data.sql

      - name: 编译 + 全量测试（backend 子目录布局）
        if: hashFiles('backend/pom.xml') != ''
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 13306
          MYSQL_USER: root
          MYSQL_PASSWORD: 123456
        run: mvn -B -ntp test
        working-directory: backend

      - name: 编译（仓库根目录布局）
        if: hashFiles('pom.xml') != '' && hashFiles('backend/pom.xml') == ''
        run: mvn -B -ntp compile -DskipTests

      - name: 未检测到后端工程
        if: hashFiles('pom.xml') == '' && hashFiles('backend/pom.xml') == ''
        run: echo "ℹ️ 未发现 pom.xml，跳过后端编译（文档仓正常现象）"

  # ---------------------------------------------------------------------------
  # 门禁 3：前端类型检查与构建（Vue 3 + Vite）
  # ---------------------------------------------------------------------------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      # 前端工程尚不存在时整个跳过 node 安装：无 lockfile 可解析会让
      # cache-dependency-path 报 "unable to cache dependencies" 而红叉
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != '' || hashFiles('package.json') != ''
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: 安装依赖（frontend 子目录布局）
        if: hashFiles('frontend/package.json') != ''
        run: npm ci || npm install
        working-directory: frontend

      - name: 类型检查与构建（frontend 子目录布局）
        if: hashFiles('frontend/package.json') != ''
        run: |
          npx vue-tsc --noEmit
          npm run build
        working-directory: frontend

      - name: 安装依赖（仓库根目录布局）
        if: hashFiles('package.json') != '' && hashFiles('frontend/package.json') == ''
        run: npm ci || npm install

      - name: 类型检查与构建（仓库根目录布局）
        if: hashFiles('package.json') != '' && hashFiles('frontend/package.json') == ''
        run: |
          npx vue-tsc --noEmit
          npm run build

      - name: 未检测到前端工程
        if: hashFiles('package.json') == '' && hashFiles('frontend/package.json') == ''
        run: echo "ℹ️ 未发现 package.json，跳过前端构建（文档仓正常现象）"

  # ---------------------------------------------------------------------------
  # 门禁 4：教师端前端类型检查与构建（成员 D 交付）
  #   Q1 拍板：教师端为同仓库 frontend-teacher/ 子目录（Monorepo）。
  #   本 job 即文件头第 1b 条「双前端目录」方案的教师端部分。
  #   学生端已按文件头 1b 双目录方案落地为 frontend-student/（门禁 5）；
  #   上方 frontend job 为旧单前端布局占位。
  # ---------------------------------------------------------------------------
  frontend-teacher:
    name: 教师端构建
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      # 教师端工程尚不存在时整个跳过 node 安装：无 lockfile 可解析会让
      # cache-dependency-path 报 "unable to cache dependencies" 而红叉
      - uses: actions/setup-node@v4
        if: hashFiles('frontend-teacher/package.json') != ''
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-teacher/package-lock.json

      - name: 安装依赖（frontend-teacher 子目录布局）
        if: hashFiles('frontend-teacher/package.json') != ''
        run: npm ci || npm install
        working-directory: frontend-teacher

      - name: 类型检查与构建（frontend-teacher 子目录布局）
        if: hashFiles('frontend-teacher/package.json') != ''
        run: |
          npx vue-tsc --noEmit
          npm run build
        working-directory: frontend-teacher

      - name: 未检测到教师端工程
        if: hashFiles('frontend-teacher/package.json') == ''
        run: echo "ℹ️ 未发现 frontend-teacher/package.json，跳过教师端构建（文档仓正常现象）"

  # ---------------------------------------------------------------------------
  # 门禁 5：学生端前端类型检查与构建（成员 C 交付）
  #   落地方案：学生端为同仓库 frontend-student/ 子目录（Monorepo），
  #   与 frontend-teacher/（门禁 4）对称，即文件头第 1b 条「双前端目录」
  #   方案的学生端部分。
  #   上方 frontend / frontend-teacher 两个 job 一字未动。
  # ---------------------------------------------------------------------------
  frontend-student:
    name: 学生端构建
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      # 学生端工程尚不存在时整个跳过 node 安装：无 lockfile 可解析会让
      # cache-dependency-path 报 "unable to cache dependencies" 而红叉
      - uses: actions/setup-node@v4
        if: hashFiles('frontend-student/package.json') != ''
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-student/package-lock.json

      - name: 安装依赖（frontend-student 子目录布局）
        if: hashFiles('frontend-student/package.json') != ''
        run: npm ci || npm install
        working-directory: frontend-student

      - name: 类型检查与构建（frontend-student 子目录布局）
        if: hashFiles('frontend-student/package.json') != ''
        run: |
          npx vue-tsc --noEmit
          npm run build
        working-directory: frontend-student

      - name: 未检测到学生端工程
        if: hashFiles('frontend-student/package.json') == ''
        run: echo "ℹ️ 未发现 frontend-student/package.json，跳过学生端构建（文档仓正常现象）"
